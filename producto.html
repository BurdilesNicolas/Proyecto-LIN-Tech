<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIN-Tech | Producto</title>
    <link rel="stylesheet" href="CSS/default.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="CSS/index.css">
    <link rel="stylesheet" href="CSS/producto.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <!-- HEADER: se carga dinámicamente desde header.html. -->
    <div id="header-container"></div>

    <!-- DETALLE: JavaScript completa acá los datos del producto elegido (producto.html?id=...). -->
    <main class="producto-main">
        <div class="container">
            <a href="productos.html" class="volver-tienda">
                <i class="bi bi-arrow-left"></i>
                Volver a la tienda
            </a>
            <section id="detalleProducto" class="detalle-producto" aria-live="polite">
                <p class="detalle-estado">Cargando producto...</p>
            </section>
        </div>
    </main>

    <!-- FOOTER: se carga dinámicamente desde footer.html. -->
    <div id="footer-container"></div>

    <script src="JavaScript/api.js" defer></script>
    <script src="JavaScript/comun.js" defer></script>
    <script src="JavaScript/producto.js" defer></script>
    <script src="main.js" defer></script>
</body>
</html>
