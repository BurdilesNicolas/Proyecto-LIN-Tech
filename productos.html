<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/default.css">
    <link rel="stylesheet" href="CSS/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="CSS/productos.css">
    <title>Document</title>
</head>
<body>
    <!-- HEADER: se carga dinámicamente desde header.html. -->
    <div id="header-container"></div>
    <!-- TIENDA: contiene filtros, búsqueda, productos y paginación. -->
    <main class="productos-main">
        <!-- SIDEBAR: permite filtrar los productos por categoría. -->
    <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Categorías</h2>
            </div>
            <div class="categorias d-flex flex-column gap-2">
                <button class="categoria-btn active" data-categoria="todos">
                    Todos
                </button>
                <button class="categoria-btn" data-categoria="gpu">
                    Tarjetas de Video
                </button>
                <button class="categoria-btn" data-categoria="procesador">
                    Procesadores
                </button>
                <button class="categoria-btn" data-categoria="ram">
                    Memorias RAM
                </button>
                <button class="categoria-btn" data-categoria="almacenamiento">
                    Almacenamiento
                </button>
                <button class="categoria-btn" data-categoria="monitor">
                    Monitores
                </button>
                <button class="categoria-btn" data-categoria="periferico">
                    Periféricos
                </button>
            </div>
        </aside>
        <!-- CONTENIDO: muestra la búsqueda, el ordenamiento y los resultados. -->
    <section class="contenedor-productos">
            <div class="productos-header">
                <div>
                    <h1>Tienda LIN-Tech</h1>
                    <p>
                        Descubrí nuestra selección de productos tecnológicos.
                    </p>
                </div>
            </div>
            <!-- TOOLBAR: permite buscar productos y cambiar su orden. -->
        <div class="productos-toolbar row g-3">
                <div class="col-12 col-md">
                    <div class="input-group">
                        <span class="input-group-text buscador-icono">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="search" id="busquedaProductos" class="form-control busqueda-productos" placeholder="Buscar productos...">
                    </div>
                </div>
                <div class="col-12 col-md-auto">
                    <select id="ordenarProductos" class="form-select ordenar-productos">
                        <option value="destacados">
                            Destacados
                        </option>
                        <option value="precio-menor">
                            Precio menor
                        </option>
                        <option value="precio-mayor">
                            Precio mayor
                        </option>
                        <option value="nombre">
                            Nombre
                        </option>
                    </select>
                </div>
            </div>
            <!-- CONTADOR: indica cuántos productos coinciden con los filtros. -->
        <div class="productos-contador">
                <span id="cantidadProductos">
                    Cargando productos...
                </span>
            </div>
            <!-- GRID: JavaScript genera acá las tarjetas de productos. -->
            <section id="gridProductos" class="grid-productos row g-4">
            </section>
            <!-- SIN RESULTADOS: se muestra cuando ningún producto coincide con los filtros. -->
            <div id="sinResultados" class="sin-resultados d-none">
                <i class="bi bi-search"></i>
                <h3>No encontramos productos</h3>
                <p>
                    Probá con otro nombre o categoría.
                </p>
            </div>
            <!-- PAGINACIÓN: JavaScript genera acá los botones de cada página. -->
            <nav class="paginacion-container" aria-label="Paginación">
                <ul id="paginacion" class="pagination justify-content-center">
                </ul>
            </nav>
        </section>
    </main>
    <!-- FOOTER: se carga dinámicamente desde footer.html. -->
<div id="footer-container"></div>
    <script src="main.js" defer></script>
    <script src="JavaScript/productos.js" defer></script>
</body>
</html>
